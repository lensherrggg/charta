[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Charta contributors"]

[workspace.dependencies]
charta = { path = "crates/charta", version = "0.1.0" }
charta-md = { path = "crates/charta-md", version = "0.1.0" }
charta-typst = { path = "crates/charta-typst", version = "0.1.0" }
charta-docx-kit = { path = "crates/charta-docx-kit", version = "0.1.0" }
charta-backend-gb9704 = { path = "crates/charta-backend-gb9704", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
